<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SamSo-Fractualizer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px -apple-system, system-ui, sans-serif; color: #ddd; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; max-width: calc(100vw - 32px); box-sizing: border-box;
        background: rgba(0,0,0,.6); padding: 10px 12px; border-radius: 10px; backdrop-filter: blur(8px); transition: opacity .4s; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  button, select { font: inherit; color: #eee; background: #222; border: 1px solid #444; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  button:hover { background: #333; }
  label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 90px; height: 4px; background: #555; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #6cf; }
  input[type=checkbox] { accent-color: #6cf; margin: 0; }
  label span { min-width: 2.6em; opacity: .7; font-variant-numeric: tabular-nums; }
  #status { opacity: .7; flex-basis: 100%; }
  #meters { display: flex; gap: 3px; align-items: flex-end; height: 24px; }
  #meters i { width: 6px; background: #6cf; border-radius: 2px; height: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="btnSys">Systeemaudio (scherm/tab delen)</button>
  <select id="devices"><option value="">Audio-invoer…</option></select>
  <select id="mode"></select>
  <select id="palette"></select>
  <button id="btnRnd">Genereer nieuwe fractal</button>
  <button id="btnAll">Alles willekeurig</button>
  <select id="auto"><option value="off">Auto-loop: uit</option><option value="seq">Auto-loop: door de presets</option><option value="gen">Auto-loop: telkens nieuwe fractal</option><option value="all">Auto-loop: alles willekeurig</option></select>
  <label>elke <input type="range" id="interval" min="5" max="120" step="5"><span id="intervalV"></span></label>
  <label><input type="checkbox" id="mono"> Zwart-wit</label>
  <label>Gevoeligheid <input type="range" id="sens" min="0" max="2" step="0.05"><span id="sensV"></span></label>
  <label>Snelheid <input type="range" id="speed" min="0" max="3" step="0.05"><span id="speedV"></span></label>
  <label>Feedback <input type="range" id="fb" min="0" max="0.95" step="0.01"><span id="fbV"></span></label>
  <button id="btnFull">Volledig scherm</button>
  <div id="meters"><i></i><i></i><i></i></div>
  <button id="btnPerm" hidden>Open privacy-instellingen</button>
  <span id="status">geen audio</span>
</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime, uPhase, uBass, uMid, uTreble, uBeat;
uniform int uMode;
// Generator: uRT kiest de familie (0 vouw, 1 Julia, 2 Newton, 3 Apollonisch, 4 vloeistof, 5 Lyapunov, 6 3D-Apollonisch,
// 7 3D-Menger); de betekenis van uRA/uRB/uRD hangt daarvan af (zie randomFractal in de JS)
uniform int uRT;
uniform vec4 uRA, uRB, uRD;
uniform vec4 uRE;         // beeld: (spiegeling 0 geen / 1 links-rechts / 2 boven-onder / 3 beide, draaiing, verschuiving x, y)
uniform vec3 uFb;         // feedback: (sterkte, zoom, draaiing)
uniform sampler2D uPrev;  // vorige frame

uniform vec3 uPa, uPb, uPc, uPd;  // kleurpalet: a + b * cos(2π(c t + d))
vec3 pal(float t) { return uPa + uPb * cos(6.28318 * (uPc * t + uPd)); }
vec2 N(float a) { return vec2(sin(a), cos(a)); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cdiv(vec2 a, vec2 b) { return vec2(a.x * b.x + a.y * b.y, a.y * b.x - a.x * b.y) / dot(b, b); }

// --- hulpfuncties voor de vloeistof- en 3D-families ---
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 5; i++) { s += a * noise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; }
  return s;
}
vec4 orb;  // baanval van de laatste afstandsmeting
// 3D-Apollonisch (herhaalde bol-inversie)
float mapA(vec3 p, float s) {
  float scale = 1.0;
  orb = vec4(1000.0);
  for (int i = 0; i < 8; i++) {
    p = -1.0 + 2.0 * fract(0.5 * p + 0.5);
    float r2 = dot(p, p);
    orb = min(orb, vec4(abs(p), r2));
    float k = s / r2;
    p *= k;
    scale *= k;
  }
  return 0.25 * abs(p.y) / scale;
}
// Oneindige Menger-spons met gedraaide tunnels; positief in de holtes
float mapM(vec3 p, float levels, float twist) {
  p.xy *= rot(p.z * twist);
  float d = -1e3, s = 1.0;
  orb = vec4(0.0);
  for (int m = 0; m < 4; m++) {
    if (float(m) >= levels) break;
    vec3 a = mod(p * s, 2.0) - 1.0;
    s *= 3.0;
    vec3 r = abs(1.0 - 3.0 * abs(a));
    float c = (min(max(r.x, r.y), min(max(r.y, r.z), max(r.z, r.x))) - 1.0) / s;
    if (c > d) { d = c; orb.x = float(m); }
  }
  return d;
}

void main() {
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / min(uRes.x, uRes.y);
  vec2 p0 = p;
  bool rnd = uMode == 6;
  p *= rot(uPhase * 0.07 * (rnd ? uRE.y : 1.0));
  p *= 1.35;  // vaste zoom: muziek stuurt vorm, kleur en helderheid, niet de camera
  if (rnd) {
    // gelote spiegeling rond het schermmidden, daarna een verschoven beeldmidden
    if ((uRE.x > 0.5 && uRE.x < 1.5) || uRE.x > 2.5) p.x = abs(p.x);
    if (uRE.x > 1.5) p.y = abs(p.y);
    p += uRE.zw;
  }

  vec3 col;
  if (rnd && uRT >= 1 && uRB.w > 0.5) {
    // gelote spiegelsymmetrie
    float seg = 6.28318 / uRB.w;
    float a = abs(mod(atan(p.y, p.x), seg) - 0.5 * seg);
    p = length(p) * vec2(cos(a), sin(a));
  }

  if ((rnd && uRT == 1) || uMode == 0 || uMode == 2 || uMode == 3 || (uMode >= 7 && uMode <= 9) || uMode == 12 || uMode == 13) {
    // Escape-time: Julia / Mandelbrot-zoom / Burning Ship / Julia³ / Phoenix / Tricorn
    vec2 z, c, zp = vec2(0.0);
    float pw = 2.0, ph = 0.0;
    bool absF = uMode == 3, conjF = uMode == 9;
    if (rnd) {
      // gelote Julia: macht, variant en c komen uit de generator
      pw = uRA.x;
      absF = abs(uRA.y - 1.0) < 0.5;
      conjF = uRA.y > 1.5;
      c = uRA.zw * (1.0 - 0.06 * uMid) + uRB.x * vec2(cos(uPhase * 0.3), sin(uPhase * 0.3));
      z = p * uRB.y;
    } else if (uMode == 0) {
      // c draait rond de rand van de Mandelbrot-set, mids duwen hem naar binnen/buiten
      float r = 0.7885 - 0.12 * uMid + 0.04 * sin(uTime * 0.13);
      c = r * vec2(cos(uPhase * 0.25), sin(uPhase * 0.25));
      z = p;
    } else if (uMode == 2) {
      float zoom = exp(-0.3 - 4.2 * (0.5 - 0.5 * cos(uPhase * 0.06)));
      c = vec2(-0.743643887, 0.131825904) + p * zoom;
      z = vec2(0.0);
    } else if (uMode == 3) {
      c = vec2(-0.52 - 0.1 * uMid + 0.06 * cos(uPhase * 0.21), -1.02 + 0.08 * sin(uPhase * 0.17));
      z = p * 1.1;
    } else if (uMode == 7) {
      float r = 0.62 - 0.08 * uMid;
      c = r * vec2(cos(uPhase * 0.22), sin(uPhase * 0.22));
      z = p * 0.95;
      pw = 3.0;
    } else if (uMode == 12) {
      float r = 0.68 - 0.07 * uMid + 0.03 * sin(uTime * 0.11);
      c = r * vec2(cos(uPhase * 0.2), sin(uPhase * 0.2));
      z = p * 0.9;
      pw = 4.0;
    } else if (uMode == 13) {
      float zoom = exp(-0.5 - 3.6 * (0.5 - 0.5 * cos(uPhase * 0.06)));
      c = vec2(-1.25066, 0.02012) + p * zoom;
      z = vec2(0.0);
    } else if (uMode == 8) {
      c = vec2(0.5667 + 0.03 * sin(uPhase * 0.2) - 0.05 * uMid, 0.0);
      ph = -0.5 + 0.08 * cos(uPhase * 0.15);
      z = p.yx * 1.05;
    } else {
      float r = 0.55 + 0.1 * sin(uPhase * 0.1) - 0.08 * uMid;
      c = r * vec2(cos(uPhase * 0.2), sin(uPhase * 0.2));
      z = p * 1.1;
    }
    float it = 0.0, trap = 1e9;
    for (int n = 0; n < 180; n++) {
      if (absF) z = abs(z);
      if (conjF) z.y = -z.y;
      vec2 zn = cmul(z, z);
      if (pw > 2.5 && pw < 3.5) zn = cmul(zn, z);
      if (pw > 3.5) zn = cmul(zn, zn);
      zn += c + ph * zp;
      zp = z;
      z = zn;
      trap = min(trap, abs(z.x * z.y));
      if (dot(z, z) > 64.0) break;
      it += 1.0;
    }
    float sm = it;
    if (it < 180.0) sm = it - log(0.5 * log(dot(z, z))) / log(pw) + 2.0;
    float t = sm * 0.025 + uTime * 0.02 + uTreble * 0.35;
    col = pal(t) * (0.06 + 0.94 * smoothstep(0.0, 14.0, sm));
    if (it >= 180.0) col = pal(uTime * 0.03 + 0.5) * 0.25 * uBass;
    col += pal(t + 0.25) * exp(-trap * 40.0) * (0.3 + uTreble);

  } else if (uMode == 1) {
    // Kaleidoscopische vouw-fractal
    vec2 z = p;
    float trap = 1e9;
    float s = 1.22 + 0.2 * uMid;
    for (int n = 0; n < 9; n++) {
      z = abs(z) - vec2(0.55 + 0.25 * uBass, 0.35);
      z *= rot(uPhase * 0.11 + 0.6);
      z *= s;
      trap = min(trap, abs(z.x) / pow(s, float(n + 1)));
    }
    float l = log(trap + 1e-7);
    float g = pow(0.5 + 0.5 * cos(l * (3.0 + 2.0 * uBass)), 3.0);
    col = pal(l * 0.12 + length(p) * 0.3 - uTime * 0.05 + uTreble * 0.4) * g * (0.8 + 1.5 * uBeat);
    col += pal(uTime * 0.02 + 0.6) * 0.08 * uBass;

  } else if (uMode == 4 || uMode == 14 || (rnd && uRT == 2)) {
    // Newton-fractal voor z^deg - 1 met complexe relaxatie (geeft de wervelingen)
    float deg = uMode == 4 ? 3.0 : (uMode == 14 ? 4.0 : uRA.x);
    vec2 z = p * 1.6 * (rnd ? uRB.y : 1.0);
    vec2 a = vec2(1.0, 0.0) + ((rnd ? uRB.x : 0.2) + 0.5 * uMid) * vec2(cos(uPhase * 0.3), sin(uPhase * 0.3));
    float it = 0.0;
    for (int n = 0; n < 32; n++) {
      vec2 zm = z;  // wordt z^(deg-1)
      for (int k = 0; k < 5; k++) {
        if (float(k) >= deg - 2.0) break;
        zm = cmul(zm, z);
      }
      vec2 d = cdiv(cmul(zm, z) - vec2(1.0, 0.0), deg * zm + vec2(1e-6, 0.0));
      z -= cmul(a, d);
      if (dot(d, d) < 1e-6) break;
      it += 1.0;
    }
    float ang = atan(z.y, z.x) / 6.28318;
    float sh = pow(1.0 - it / 32.0, 1.6);
    col = pal(ang + it * 0.02 + uTime * 0.02 + uTreble * 0.3) * sh * (0.55 + 0.9 * uBass);

  } else if (uMode == 15 || (rnd && uRT == 0)) {
    // Vouw-fractal met gelote symmetrie, vouw, rotatie, schaal en inversie
    // uRA = (symmetrie, vouw x, vouw y, hoek), uRB = (schaal, trap-mix, kleurfrequentie, inversie),
    // uRD = (log-polair aan/uit, cellen, draaiing, bandfrequentie)
    vec2 z;
    float pr = length(p) + 1e-5;
    if (uRD.x > 0.5) {
      // log-polair raster: oneindige zoom met gelote cellen en draaiing
      vec2 lp = vec2(log(pr) - uPhase * 0.1, atan(p.y, p.x) / 6.28318);
      z = abs(fract(vec2(lp.x * 1.1 + lp.y * uRD.z, lp.y * uRD.y)) - 0.5) * 2.2;
    } else {
      float seg = 6.28318 / uRA.x;
      float ang = mod(atan(p.y, p.x), seg) - 0.5 * seg;
      z = pr * vec2(cos(ang), sin(ang));
    }
    float sc = 1.0, trap = 1e9;
    float s = uRB.x + 0.15 * uMid;
    for (int n = 0; n < 10; n++) {
      z = abs(z) - uRA.yz * (1.0 + 0.3 * uBass);
      z *= rot(uRA.w + uPhase * 0.09);
      if (uRB.w > 0.5) { float k = 1.0 / clamp(dot(z, z), 0.2, 1.0); z *= k; sc *= k; }
      z *= s;
      sc *= s;
      trap = min(trap, abs(mix(z.x, length(z) - 0.4, uRB.y)) / sc);
    }
    float l = log(trap + 1e-7);
    float g = pow(0.5 + 0.5 * cos(l * (uRD.w + 2.0 * uBass)), 3.0 - 1.5 * uRD.x) * (1.0 + 0.5 * uRD.x);
    float t = l * uRB.z + length(p) * 0.25 - uTime * 0.04 + uTreble * 0.4;
    col = pal(t) * g * (0.8 + 1.5 * uBeat);
    col *= mix(1.0, smoothstep(0.0, 0.25, pr), uRD.x);

  } else if (uMode == 10) {
    // Koch-sneeuwvlok via spiegelvouwen
    vec2 uv = p * 0.6;
    uv.x = abs(uv.x);
    uv.y += tan(0.8333 * 3.14159) * 0.5;
    vec2 n = N(0.8333 * 3.14159);
    uv -= n * max(0.0, dot(uv - vec2(0.5, 0.0), n)) * 2.0;
    n = N((0.6667 + 0.07 * uMid * sin(uPhase * 0.3)) * 3.14159);
    float sc = 1.0;
    uv.x += 0.5;
    for (int i = 0; i < 6; i++) {
      uv *= 3.0;
      sc *= 3.0;
      uv.x -= 1.5;
      uv.x = abs(uv.x);
      uv.x -= 0.5;
      uv -= n * min(0.0, dot(uv, n)) * 2.0;
    }
    float d = length(uv - vec2(clamp(uv.x, -1.0, 1.0), 0.0)) / sc;
    float l = log(d + 1e-6);
    float g = 1.3 * exp(-d * (50.0 - 30.0 * uBass)) + 0.7 * pow(0.5 + 0.5 * cos(l * 4.0 - uPhase * 0.5), 2.0);
    col = pal(l * 0.15 + uTime * 0.03 + uTreble * 0.4) * g * (0.8 + 1.2 * uBeat);

  } else if (uMode == 11) {
    // Oneindige zoom: vouw-fractal op een log-polair raster
    float r = length(p) + 1e-5;
    vec2 lp = vec2(log(r) - uPhase * 0.12, atan(p.y, p.x) / 6.28318);
    vec2 q = fract(vec2(lp.x * 1.1 + lp.y, lp.y * 6.0)) - 0.5;
    vec2 z = abs(q) * 2.0;
    float trap = 1e9;
    float s = 1.3 + 0.2 * uMid;
    for (int n = 0; n < 6; n++) {
      z = abs(z) - vec2(0.5 + 0.2 * uBass, 0.3);
      z *= rot(uPhase * 0.08 + 0.9);
      z *= s;
      trap = min(trap, abs(z.x) / pow(s, float(n + 1)));
    }
    float l = log(trap + 1e-7);
    float g = 1.5 * pow(0.5 + 0.5 * cos(l * 3.5), 1.5);
    col = pal(l * 0.12 + lp.x * 0.5 + uTime * 0.03 + uTreble * 0.4) * g * (0.8 + 1.5 * uBeat);
    col *= smoothstep(0.0, 0.25, r);

  } else if (rnd && uRT == 4) {
    // Vloeistof: fractale ruis die zichzelf vervormt
    // uRA = (schaal, vervorming 1, vervorming 2, kleurfrequentie), uRB = (lijnfrequentie, lijnen aan/uit)
    vec2 q = p * uRA.x;
    float t = uPhase * 0.12;
    vec2 w1 = vec2(fbm(q + vec2(0.0, t)), fbm(q + vec2(5.2, 1.3 - t)));
    vec2 w2 = vec2(fbm(q + uRA.y * w1 + vec2(1.7, 9.2) + 0.15 * t), fbm(q + uRA.y * w1 + vec2(8.3, 2.8) - 0.126 * t));
    float f = fbm(q + (uRA.z + 2.0 * uBass) * w2);
    float lines = mix(1.0, 0.25 + pow(abs(sin(f * uRB.x * 6.28318)), 0.35), uRB.y);
    col = pal(f * uRA.w + length(w2) * 0.6 + uTime * 0.02 + uTreble * 0.3) * (0.25 + 1.5 * f * f + 0.6 * dot(w2, w2)) * lines;
    col *= 0.8 + 0.8 * uBeat;

  } else if (rnd && uRT == 5) {
    // Lyapunov-fractal van de logistische afbeelding
    // uRA = (midden a, midden b, schaal, volgorde als bitmasker), uRB = (lengte van de volgorde, kleurfrequentie)
    vec2 ab = clamp(uRA.xy + p * uRA.z, 0.5, 4.0);
    float x = 0.5, lam = 0.0;
    for (int n = 0; n < 72; n++) {
      float bit = mod(floor(uRA.w / pow(2.0, mod(float(n), uRB.x))), 2.0);
      float r = mix(ab.x, ab.y, bit);
      x = r * x * (1.0 - x);
      if (n >= 12) lam += log(abs(r * (1.0 - 2.0 * x)) + 1e-6);
    }
    lam /= 60.0;
    if (lam < 0.0) col = pal(-lam * uRB.y + uTime * 0.02 + uTreble * 0.3) * (0.2 + min(1.0, -lam * 1.6)) * (0.8 + 0.8 * uBass);
    else col = pal(0.6 + lam) * 0.07 * (1.0 + 3.0 * uBass);

  } else if (rnd && uRT == 6) {
    // Vlucht door een 3D-Apollonische ruimte
    // uRA = (inversiesterkte, kleurfrequentie, vliegsnelheid, starttijd)
    float t = uPhase * 0.04 * uRA.z + uRA.w;
    vec3 ro = vec3(2.8 * cos(0.1 + 0.33 * t), 0.4 + 0.3 * cos(0.37 * t), 2.8 * cos(0.5 + 0.35 * t));
    vec3 ta = vec3(1.9 * cos(1.2 + 0.41 * t), 0.4 + 0.1 * cos(0.27 * t), 1.9 * cos(2.0 + 0.38 * t));
    vec3 ww = normalize(ta - ro), uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0))), vv = cross(uu, ww);
    vec3 rd = normalize(p.x * uu + p.y * vv + 2.2 * ww);
    float s = uRA.x + 0.1 * uMid;
    float tt = 0.01, steps = 0.0;
    for (int i = 0; i < 72; i++) {
      float d = mapA(ro + rd * tt, s);
      if (d < 0.001 * tt || tt > 30.0) break;
      tt += d;
      steps += 1.0;
    }
    col = vec3(0.0);
    if (tt < 30.0) {
      float ao = 1.0 - steps / 72.0;
      col = pal(orb.w * uRA.y + orb.x * 0.6 + uTime * 0.02 + uTreble * 0.3) * ao * exp(-0.05 * tt) * (1.5 + 1.0 * uBass);
    }

  } else if (rnd && uRT == 7) {
    // Vlucht door de tunnels van een oneindige Menger-spons
    // uRA = (niveaus, tunneldraaiing, vliegsnelheid, kijkzwaai), uRB = (kleurfrequentie)
    float zt = uPhase * 0.25 * uRA.z;
    vec3 ro = vec3(0.12 * sin(zt * 0.7), 0.12 * cos(zt * 0.5), zt);
    vec3 rd = normalize(vec3(p + uRA.w * vec2(sin(zt * 0.3), cos(zt * 0.23)), 1.6));
    float tt = 0.0, steps = 0.0;
    for (int i = 0; i < 72; i++) {
      float d = mapM(ro + rd * tt, uRA.x, uRA.y);
      if (d < 0.0006 * (1.0 + 2.0 * tt) || tt > 12.0) break;
      tt += d * 0.9;
      steps += 1.0;
    }
    col = vec3(0.0);
    if (tt < 12.0) {
      float ao = pow(1.0 - steps / 72.0, 1.3);
      col = pal(orb.x * 0.21 * uRB.x + tt * 0.06 + uTime * 0.02 + uTreble * 0.3) * ao * exp(-0.22 * tt) * (0.9 + 0.9 * uBass);
    }

  } else {
    // Apollonische cirkel-inversie
    vec2 z = p * (rnd ? uRA.y : 0.8) + 0.5 * vec2(cos(uPhase * 0.05), sin(uPhase * 0.07));
    float sc = 1.0, trap = 1e9;
    float s = (rnd ? uRA.x : 1.12) + 0.25 * uMid + 0.08 * sin(uPhase * 0.2);
    for (int n = 0; n < 8; n++) {
      z = -1.0 + 2.0 * fract(0.5 * z + 0.5);
      float r2 = dot(z, z);
      trap = min(trap, r2);
      float k = s / r2;
      z *= k;
      sc *= k;
    }
    float d = 0.25 * abs(z.y) / sc;
    float g = exp(-d * (350.0 - 250.0 * uBass));
    col = pal(log(trap + 1e-6) * 0.2 + uTime * 0.03 + uTreble * 0.4) * (0.12 + g) * (0.8 + 1.2 * uBeat);
  }

  col *= 0.75 + 0.6 * uBeat;
  col *= 1.0 - 0.16 * dot(p0, p0);
  col = pow(max(col, 0.0), vec3(0.85));
  if (uFb.x > 0.001) {

    vec2 q = rot(uFb.z) * p0 / uFb.y;
    vec2 uv = q * min(uRes.x, uRes.y) / uRes * 0.5 + 0.5;
    float inside = step(abs(uv.x - 0.5), 0.5) * step(abs(uv.y - 0.5), 0.5);
    col = max(col, texture2D(uPrev, uv).rgb * uFb.x * inside);
  }
  gl_FragColor = vec4(col, 1.0);
}

<script>

const palettes = [

  ['Zonsondergang', [.5, .5, .5],   [.5, .5, .5],   [1, 1, 1],    [0, .1, .2]],

const RANDOM = 6;

function juliaOK(pw, variant, cx, cy, zoom) {

// Loot een Julia: macht 2-4, gewoon / burning ship / tricorn, c net buiten de rand van het hoofdlichaam
function randomJulia(sym) {
  const r = Math.random;
  for (let tries = 0; tries < 40; tries++) {
    const pw = pick([2, 2, 2, 3, 4]), variant = pick([0, 0, 0, 1, 2]);
    const th = r() * 2 * Math.PI, k = 1 + r() * 0.12;

      cy = 0.25 * k * Math.sin(th);

// Loot een compleet nieuwe fractal. a/b/d gaan als uRA/uRB/uRD naar de shader (betekenis per familie: zie de shader),

const S = { mode: 0, pal: 0, fb: 0, auto: 'off', interval: 20, mono: false, sens: 1, speed: 1, rnd: randomFractal() };

// --- Audio ---
let ctx, analyser, bins, source, stream;

  { lo: 150, hi: 2000, v: 0, max: 0.1 },
  { lo: 2000, hi: 9000, v: 0, max: 0.1 },
];

  if (stream) stream.getTracks().forEach(t => t.stop());

  ctx.resume();
  if (source) source.disconnect();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.5;
  bins = new Uint8Array(analyser.frequencyBinCount);
  source = ctx.createMediaStreamSource(stream);
  source.connect(analyser);  // niet naar destination: geen echo

  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');

$('devices').onfocus = async () => {

// In de standalone app levert de native kant de bandniveaus (systeemaudio)
const inApp = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.app);

function analyse(dt) {
  if (!analyser && !native) return;

  if (!native) {

  if (bass > bassAvg * 1.35 && bass > 0.35) beat = 1;
  bassAvg += (bass - bassAvg) * 0.05;

// --- Loop ---
const FADE = 0.6;  // seconden in/uit-faden rond een auto-wissel

  if (S.auto !== 'off') {
    autoT += dt;
    if (autoT >= S.interval) {
      if (S.auto === 'all') {
        randomizeAll();
      } else if (S.auto === 'gen') {
        // telkens een compleet nieuwe fractal
        generate();
      } else {
        // presets op volgorde, met elke keer een ander kleurpalet
        setMode(presets[(presets.indexOf(S.mode) + 1) % presets.length]);
        S.pal = (S.pal + 1) % palettes.length;
        syncUI();
      }
      autoT = 0;
    }
    fade = Math.max(0, Math.min(1, autoT / FADE, (S.interval - autoT) / FADE));

  gl.activeTexture(gl.TEXTURE0);

  gl.uniform1f(U.uMid, m);
  gl.uniform1f(U.uTreble, t);
  gl.uniform1f(U.uBeat, beat);

  gl.uniform3fv(U.uPa, curPal.slice(0, 3));
  gl.uniform3fv(U.uPb, curPal.slice(3, 6));
  gl.uniform3fv(U.uPc, curPal.slice(6, 9));

  gl.uniform2f(B.uRes, canvas.width, canvas.height);
  gl.uniform1f(B.uMono, S.mono ? 1 : 0);
  gl.uniform1f(B.uFade, fade);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  meters.forEach((el, i) => el.style.height = (2 + bands[i].v * 22) + 'px');

}

  $('speed').value = S.speed; $('speedV').textContent = Math.round(S.speed * 100) + '%';
}
$('mode').onchange = e => { setMode(+e.target.value); autoT = FADE; };
$('palette').onchange = e => { S.pal = +e.target.value; save(); };
$('btnAll').onclick = () => { randomizeAll(); autoT = FADE; };
$('btnRnd').onclick = () => { generate(); autoT = FADE; };
$('auto').onchange = e => { S.auto = e.target.value; autoT = FADE; save(); };
$('mono').onchange = e => { S.mono = e.target.checked; save(); };
for (const k of ['interval', 'sens', 'speed', 'fb']) $(k).oninput = e => { S[k] = +e.target.value; syncUI(); save(); };
$('btnFull').onclick = () => {
  if (inApp) window.webkit.messageHandlers.app.postMessage('fullscreen');
  else document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
};
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  const inControl = /^(INPUT|SELECT)$/.test(e.target.tagName);
  if (inApp && !inControl) e.preventDefault();  // voorkomt de systeempiep in de app
  if (inControl && e.key.startsWith('Arrow')) return;
  const k = e.key.toLowerCase();
  if (k === 'h') $('ui').classList.toggle('hidden');
  if (k === 'f') $('btnFull').click();
  if (k === 'm') nextMode();
  if (k === 'a') { S.auto = { off: 'seq', seq: 'gen', gen: 'all', all: 'off' }[S.auto]; autoT = FADE; syncUI(); save(); }
  if (k === 'r') $('btnRnd').click();
  if (k === 'x') $('btnAll').click();
  if (k === 'b') { S.mono = !S.mono; syncUI(); save(); }
  if (k === 'c') { S.pal = (S.pal + 1) % palettes.length; syncUI(); save(); }
  if (k >= '1' && k <= '9') { setMode(order[+k - 1]); autoT = FADE; }
});
// Paneel en muiswijzer verdwijnen na 10 s zonder muisbeweging en komen terug zodra de muis beweegt
let idleTimer;
function wake() {
  $('ui').classList.remove('hidden');
  document.body.style.cursor = '';
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { $('ui').classList.add('hidden'); document.body.style.cursor = 'none'; }, 10000);
}
for (const ev of ['mousemove', 'mousedown', 'wheel']) addEventListener(ev, wake);
wake();

syncUI();
requestAnimationFrame(frame);
</script>
</body>
